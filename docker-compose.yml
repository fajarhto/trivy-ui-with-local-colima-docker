name: trivy-ui
services:
  backend:
    image: trivy-ui-local-backend:1.3.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trivy-ui-backend
    restart: unless-stopped
    environment:
      ENV: production
      DB_BACKEND: filesystem
      TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the Docker socket group inside the VM}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy-cache:/home/fajarhartanto/.cache/trivy
      - reports:/app/backend/app/storage/reports
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
  frontend:
    image: trivy-ui-local-frontend:1.3.1
    build: ./frontend
    container_name: trivy-ui-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:3080:8080'
    depends_on:
      backend:
        condition: service_healthy
volumes:
  reports:
  trivy-cache:
